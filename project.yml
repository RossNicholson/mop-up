name: MopUp
options:
  bundleIdPrefix: com.rossnicholson
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  HouseStyle:
    url: https://github.com/RossNicholson/mac-house-style
    from: 1.1.0

targets:
  MopUp:
    type: application
    platform: macOS
    sources:
      - path: MopUp
    dependencies:
      - package: HouseStyle
    info:
      path: MopUp/Info.plist
      properties:
        CFBundleName: Mop Up
        CFBundleDisplayName: Mop Up
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "4"
        LSApplicationCategoryType: public.app-category.utilities
        NSHighResolutionCapable: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Mop Up © 2026 Ross Nicholson, GPL-3.0. Cleaning engine: Mole by tw93, GPL-3.0."
    settings:
      base:
        PRODUCT_NAME: Mop Up
        PRODUCT_BUNDLE_IDENTIFIER: com.rossnicholson.MopUp
        CODE_SIGN_ENTITLEMENTS: MopUp/MopUp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: "5HQ5V9NP82"
          ENABLE_HARDENED_RUNTIME: YES
    postBuildScripts:
      - name: Bundle Mole engine
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          # Fetch + verify the pinned Mole release (no-op when already vendored)
          "$SRCROOT/scripts/vendor-mole.sh"
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/mole"
          mkdir -p "$DEST"
          rsync -a --delete "$SRCROOT/Vendor/mole/" "$DEST/"
          # Mole's Go helpers are Mach-O, so they need their own signature with
          # the hardened runtime. The app bundle itself is signed after this.
          if [ "${CODE_SIGNING_ALLOWED:-YES}" = "YES" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            TS="--timestamp"
            [ "$EXPANDED_CODE_SIGN_IDENTITY" = "-" ] && TS="--timestamp=none"
            for helper in analyze-go status-go; do
              codesign --force --options runtime $TS --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$DEST/bin/$helper"
            done
          fi
    scheme:
      testTargets:
        - MopUpTests

  MopUpTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MopUpTests
    dependencies:
      - target: MopUp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rossnicholson.MopUpTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mop Up.app/Contents/MacOS/Mop Up"
        BUNDLE_LOADER: "$(TEST_HOST)"
